<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" fill="none" role="img" aria-labelledby="cargochatter-title cargochatter-desc">
  <title id="cargochatter-title">CargoChatter provider and chat illustration</title>
  <desc id="cargochatter-desc">Illustration of a logistics provider profile beside a chat window on a business website.</desc>

  <!-- A quiet host-page frame establishes the embedded experience. -->
  <rect x="24" y="38" width="592" height="432" rx="16" fill="#FFFFFF" stroke="#DADDD8" stroke-width="1.6"/>
  <path d="M25 88H615" stroke="#E4E6E1" stroke-width="1.5"/>
  <circle cx="46" cy="63" r="3.5" fill="#A8B0AA"/>
  <circle cx="59" cy="63" r="3.5" fill="#C7CDC8"/>
  <circle cx="72" cy="63" r="3.5" fill="#DFE3DE"/>
  <rect x="222" y="55" width="192" height="17" rx="8.5" fill="#F4F5F1"/>
  <path d="M582 59H594M582 64H594M582 69H594" stroke="#9AA69F" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="48" y="114" width="145" height="8" rx="4" fill="#58675F"/>
  <rect x="48" y="132" width="174" height="4" rx="2" fill="#D2D8D2"/>
  <rect x="48" y="162" width="106" height="124" rx="9" fill="#F3F2ED"/>
  <rect x="166" y="162" width="106" height="124" rx="9" fill="#EEF2F5"/>

  <!-- Geometric merchandise, deliberately not a real catalogue. -->
  <path d="M76 258V213C76 199 87 188 101 188C115 188 126 199 126 213V258H76Z" fill="#819189"/>
  <path d="M88 258V214C88 206 94 200 101 200C108 200 114 206 114 214V258H88Z" fill="#F3F2ED"/>
  <path d="m192 210 27-15 27 15-27 15-27-15Z" fill="#FDFDF9" stroke="#ACB8B1" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="m192 210 27 15v29l-27-15v-29Z" fill="#DEE5DF" stroke="#ACB8B1" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="m219 225 27-15v29l-27 15v-29Z" fill="#C2CFC6" stroke="#ACB8B1" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- A provider profile connects to its conversation, with no invented identity. -->
  <path d="M272 340H281C286 340 290 336 290 331V163C290 158 294 154 300 154" stroke="#9CAF9E" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="272" cy="340" r="3" fill="#183E35"/>
  <rect x="48" y="306" width="224" height="136" rx="12" fill="#FFFFFF" stroke="#CCD6CD" stroke-width="1.6"/>
  <rect x="64" y="322" width="39" height="39" rx="9" fill="#EDF3E9"/>
  <path d="M73 351V336L83.5 330L94 336V351H73Z" stroke="#183E35" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M78 351V342H89V351M77 337H79M83 337H85M89 337H91" stroke="#183E35" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="114" y="330" width="108" height="6" rx="3" fill="#53675B"/>
  <rect x="114" y="344" width="78" height="4" rx="2" fill="#CDD5CC"/>
  <path d="M64 377H256" stroke="#E4E8E1" stroke-width="1.2"/>
  <rect x="64" y="390" width="80" height="4" rx="2" fill="#B0BDB1"/>
  <rect x="64" y="402" width="126" height="4" rx="2" fill="#D3DBD1"/>
  <rect x="64" y="414" width="98" height="4" rx="2" fill="#D3DBD1"/>
  <circle cx="239" cy="403" r="14" fill="#EDF3E9"/>
  <path d="M233 403H245M240 398L245 403L240 408" stroke="#183E35" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- An embedded conversation window: provider, request, reply and composer. -->
  <rect x="300" y="112" width="288" height="330" rx="14" fill="#FFFFFF" stroke="#BBCDBF" stroke-width="1.6"/>
  <path d="M314 112H574C581.7 112 588 118.3 588 126V178H300V126C300 118.3 306.3 112 314 112Z" fill="#183E35"/>
  <rect x="316" y="130" width="35" height="35" rx="8" fill="#DCF789"/>
  <path d="M324 156V141L333.5 136L343 141V156H324Z" stroke="#183E35" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M329 156V147H338V156M329 142H331M336 142H338" stroke="#183E35" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="363" y="136" width="131" height="6" rx="3" fill="#F7F6EF"/>
  <rect x="363" y="151" width="91" height="4" rx="2" fill="#B3C6B8"/>
  <path d="m562 136 9 9m0-9-9 9" stroke="#D5E3D7" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Shipment details, represented by a parcel and a two-point route. -->
  <path d="M329 196H529C534.5 196 539 200.5 539 206V255C539 260.5 534.5 265 529 265H332L319 272V206C319 200.5 323.5 196 329 196Z" fill="#F0F3ED"/>
  <path d="m333 214 9-5 9 5-9 5-9-5Zm0 0v10l9 5 9-5v-10m-9 5v10" stroke="#52705B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="363" y="211" width="143" height="5" rx="2.5" fill="#839985"/>
  <rect x="363" y="223" width="108" height="4" rx="2" fill="#BDCCBA"/>
  <path d="M339 246H496" stroke="#A6BAA5" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="339" cy="246" r="4" fill="#F0F3ED" stroke="#52705B" stroke-width="1.5"/>
  <circle cx="496" cy="246" r="4" fill="#52705B"/>

  <!-- A response has no fabricated quote, time or promise. -->
  <path d="M388 284H558C563.5 284 568 288.5 568 294V348L555 341H388C382.5 341 378 336.5 378 331V294C378 288.5 382.5 284 388 284Z" fill="#183E35"/>
  <rect x="393" y="299" width="150" height="4" rx="2" fill="#E6EFDE"/>
  <rect x="393" y="311" width="133" height="4" rx="2" fill="#AEC2AF"/>
  <rect x="393" y="323" width="92" height="4" rx="2" fill="#AEC2AF"/>
  <rect x="319" y="365" width="250" height="34" rx="9" fill="#FAFBF8" stroke="#D9E2D7" stroke-width="1.2"/>
  <rect x="332" y="380" width="115" height="4" rx="2" fill="#CDD8CA"/>
  <circle cx="551" cy="382" r="10" fill="#DCF789"/>
  <path d="M547 382H555M551 378L555 382L551 386" stroke="#183E35" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="444" y="424" text-anchor="middle" fill="#68766D" font-family="Arial, Helvetica, sans-serif" font-size="11">Powered by CargoChatter</text>
</svg>
