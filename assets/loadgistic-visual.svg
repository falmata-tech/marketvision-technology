<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="650" viewBox="0 0 1000 650" fill="none" class="platform-illustration" role="img" focusable="false" aria-labelledby="loadgistic-title loadgistic-desc" aria-label="Illustration of available transport capacity, a shared route and shipment updates" data-i18n-aria-label="access.006">
  <title id="loadgistic-title" data-i18n-html="heading.loadgistic-title">Loadgistic capacity sharing and shipment visibility illustration</title>
  <desc id="loadgistic-desc" data-i18n-text="copy.035">A freight vehicle with available cargo space connects to a private network, then to a shipment update card. Precise route lines and a lock symbol convey controlled sharing and shipment visibility without depicting real locations or shipment data. This is a conceptual illustration, not a product screenshot.</desc>
  <defs>
    <filter id="lgv-dashboard-shadow" x="-10%" y="-12%" width="120%" height="130%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="lgv-panel-blur"/>
      <feOffset in="lgv-panel-blur" dy="10" result="lgv-panel-offset"/>
      <feFlood flood-color="#0B1D3A" flood-opacity=".07" result="lgv-panel-color"/>
      <feComposite in="lgv-panel-color" in2="lgv-panel-offset" operator="in" result="lgv-panel-shadow"/>
      <feMerge><feMergeNode in="lgv-panel-shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lgv-truck-shadow" x="-15%" y="-20%" width="130%" height="145%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="13" result="lgv-truck-blur"/>
      <feOffset in="lgv-truck-blur" dy="10" result="lgv-truck-offset"/>
      <feFlood flood-color="#0B1D3A" flood-opacity=".12" result="lgv-truck-color"/>
      <feComposite in="lgv-truck-color" in2="lgv-truck-offset" operator="in" result="lgv-truck-shadow-layer"/>
      <feMerge><feMergeNode in="lgv-truck-shadow-layer"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="lgv-map-clip">
      <rect x="54" y="122" width="892" height="296" rx="16"/>
    </clipPath>
    <g id="lgv-vehicle-glyph" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-12-7H3V5H-12Z"/>
      <path d="M3-3H8L13 2V5H3"/>
      <circle cx="-7" cy="6" r="3" fill="currentColor" stroke="none"/>
      <circle cx="8" cy="6" r="3" fill="currentColor" stroke="none"/>
    </g>
  </defs>

  <rect width="1000" height="650" fill="#EAF1FF"/>
  <rect x="36" y="26" width="928" height="596" rx="25" fill="#FFFFFF" stroke="#D7DFEB" stroke-width="1.5" filter="url(#lgv-dashboard-shadow)"/>

