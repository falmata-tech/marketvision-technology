<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" fill="none" role="img" aria-labelledby="loadgistic-title loadgistic-desc">
  <title id="loadgistic-title">Loadgistic capacity sharing and shipment visibility illustration</title>
  <desc id="loadgistic-desc">A freight vehicle with available cargo space connects to a private network, then to a shipment update card. Precise route lines and a lock symbol convey controlled sharing and shipment visibility without depicting real locations or shipment data. This is a conceptual illustration, not a product screenshot.</desc>
  <rect width="1000" height="650" fill="#F4F2EC"/>

  <!-- A route links capacity, a private network, and shipment updates. -->
  <path d="M266 284V327C266 336 274 344 283 344H717C726 344 734 336 734 327V284M500 344V406" stroke="#AAB5C6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M266 284V327C266 336 274 344 283 344H500V406" stroke="#2557D6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="500" cy="344" r="8" fill="#2557D6" stroke="#F4F2EC" stroke-width="4"/>

  <!-- Capacity card. -->
  <rect x="58" y="52" width="416" height="238" rx="18" fill="#FFFFFF" stroke="#DADDD8" stroke-width="2"/>
  <text x="88" y="102" fill="#252A2D" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" letter-spacing="-.5">Available capacity</text>
  <path d="M88 124H444" stroke="#E4E6E1" stroke-width="2"/>

  <!-- Vehicle geometry: solid cargo blocks beside visibly open space. -->
  <rect x="101" y="156" width="228" height="82" rx="5" fill="#F8F9F6" stroke="#252A2D" stroke-width="2"/>
  <rect x="114" y="170" width="49" height="54" rx="3" fill="#2557D6"/>
  <rect x="172" y="170" width="49" height="54" rx="3" fill="#2557D6"/>
  <rect x="231" y="170" width="84" height="54" rx="3" fill="#ECF1FF" stroke="#92A9DE" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M263 197H283M273 187V207" stroke="#2557D6" stroke-width="2" stroke-linecap="round"/>
  <path d="M329 183H365L395 210V238H329V183Z" fill="#E2E7E3" stroke="#252A2D" stroke-width="2" stroke-linejoin="round"/>
  <path d="M341 194H359L377 210H341V194Z" fill="#FFFFFF" stroke="#252A2D" stroke-width="2" stroke-linejoin="round"/>
  <path d="M97 238H402" stroke="#252A2D" stroke-width="3" stroke-linecap="round"/>
  <circle cx="144" cy="239" r="15" fill="#252A2D"/>
  <circle cx="144" cy="239" r="6" fill="#FFFFFF"/>
  <circle cx="292" cy="239" r="15" fill="#252A2D"/>
  <circle cx="292" cy="239" r="6" fill="#FFFFFF"/>
  <circle cx="366" cy="239" r="15" fill="#252A2D"/>
  <circle cx="366" cy="239" r="6" fill="#FFFFFF"/>

  <!-- Network card, represented by business nodes rather than people. -->
  <rect x="526" y="52" width="416" height="238" rx="18" fill="#FFFFFF" stroke="#DADDD8" stroke-width="2"/>
  <text x="556" y="102" fill="#252A2D" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" letter-spacing="-.5">Shared with your network</text>
  <path d="M556 124H912" stroke="#E4E6E1" stroke-width="2"/>
  <path d="M614 174H664L704 210M614 246H664L704 210M764 210H816V174H852M816 210V246H852" stroke="#AFBAC8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="586" y="158" width="32" height="32" rx="7" fill="#F3F5F1" stroke="#A6B0A6" stroke-width="2"/>
  <rect x="586" y="230" width="32" height="32" rx="7" fill="#F3F5F1" stroke="#A6B0A6" stroke-width="2"/>
  <rect x="850" y="158" width="32" height="32" rx="7" fill="#F3F5F1" stroke="#A6B0A6" stroke-width="2"/>
  <rect x="850" y="230" width="32" height="32" rx="7" fill="#F3F5F1" stroke="#A6B0A6" stroke-width="2"/>
  <rect x="704" y="180" width="60" height="60" rx="15" fill="#2557D6"/>
  <rect x="721" y="207" width="26" height="20" rx="4" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M726 207V201C726 197 729 194 734 194C739 194 742 197 742 201V207" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <path d="M734 214V220" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

  <!-- Shipment update card: an abstract route, without fabricated values. -->
  <rect x="208" y="406" width="584" height="196" rx="18" fill="#FFFFFF" stroke="#DADDD8" stroke-width="2"/>
  <circle cx="250" cy="449" r="13" fill="#ECF1FF"/>
  <path d="M244 449L248 453L256 445" stroke="#2557D6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="278" y="458" fill="#252A2D" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" letter-spacing="-.5">Shipment updates</text>
  <path d="M240 480H760" stroke="#E4E6E1" stroke-width="2"/>
  <path d="M268 543H390C401 543 410 534 410 523C410 512 419 503 430 503H570C581 503 590 512 590 523C590 534 599 543 610 543H732" stroke="#CFD7E1" stroke-width="3" stroke-linecap="round"/>
  <path d="M268 543H390C401 543 410 534 410 523C410 512 419 503 430 503H500" stroke="#2557D6" stroke-width="3" stroke-linecap="round"/>
  <circle cx="268" cy="543" r="8" fill="#FFFFFF" stroke="#2557D6" stroke-width="3"/>
  <circle cx="500" cy="503" r="11" fill="#2557D6" stroke="#FFFFFF" stroke-width="4"/>
  <circle cx="732" cy="543" r="8" fill="#FFFFFF" stroke="#AAB5C6" stroke-width="3"/>
</svg>
